[package]
name = "lorito"
version = "0.1.0"
edition = "2024"

[dependencies]
# screencast: remote_desktop imports screencast::Stream ungated, so it is required.
ashpd = { version = "0.13.13", features = ["remote_desktop", "screencast"] }
eframe = "0.33.3"
libc = "0.2"
tokio = { version = "1.54.1", features = ["rt", "time"] }
transcribe-rs = { version = "0.3.12", features = ["onnx"] }
